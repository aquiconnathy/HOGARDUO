<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for maskable icons -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="240" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>

  <!-- Couple Faces Emoji / Graphics -->
  <g transform="translate(0, -10)">
    <!-- House Roof Line in gold -->
    <path d="M 120 250 L 256 130 L 392 250" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Big Glowing Heart -->
    <path d="M 256 160 C 240 130 200 125 180 150 C 150 185 185 225 256 270 C 327 225 362 185 332 150 C 312 125 272 130 256 160 Z" fill="url(#heartGrad)" filter="url(#glow)"/>

    <!-- Couple Avatar Badges -->
    <!-- Partner 1 (Female) -->
    <circle cx="195" cy="315" r="55" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="6"/>
    <text x="195" y="338" font-size="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">👩</text>

    <!-- Center Ring / Sparkle -->
    <circle cx="256" cy="325" r="14" fill="#fbbf24"/>
    <path d="M 256 300 L 256 350 M 231 325 L 281 325" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

    <!-- Partner 2 (Male) -->
    <circle cx="317" cy="315" r="55" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="6"/>
    <text x="317" y="338" font-size="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">👨</text>

    <!-- App Name Text -->
    <text x="256" y="435" font-size="44" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" letter-spacing="2">HOGARDÚO</text>
  </g>
</svg>
